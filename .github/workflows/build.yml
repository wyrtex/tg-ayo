name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'patches/**'
      - 'branding/**'
      - '.github/workflows/build.yml'
      - 'UPSTREAM_COMMIT'

env:
  APP_NAME: AyoGram
  APP_BUNDLE_ID: org.ayogram.ios

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Fetch upstream Telegram-iOS
        run: |
          set -ex
          sudo mkdir -p /Users/Shared
          UPSTREAM_COMMIT="$(cat UPSTREAM_COMMIT | tr -d '[:space:]')"
          git init /Users/Shared/telegram-ios
          cd /Users/Shared/telegram-ios
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Apply patches
        run: |
          set -ex
          cd /Users/Shared/telegram-ios
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "Applying $p"
            git apply --whitespace=nowarn "$p"
          done

      - name: Apply branding (name + icon)
        run: |
          set -ex
          python3 "$GITHUB_WORKSPACE/branding/apply_branding.py" /Users/Shared/telegram-ios "$APP_NAME"

      - name: Select Xcode
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            echo "Xcode $XCODE_VERSION not found, using default"
            ls /Applications | grep -i xcode
          fi
          xcodebuild -version

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -e
          cd /Users/Shared/telegram-ios
          python3 - <<'PY'
          import json, os
          c = json.load(open('build-system/appstore-configuration.json'))
          c['api_id'] = os.environ['TG_API_ID']
          c['api_hash'] = os.environ['TG_API_HASH']
          # Sideloaded builds have no iCloud/Siri entitlements; CloudKit throws without them
          c['enable_icloud'] = False
          c['enable_siri'] = False
          json.dump(c, open('build-system/ayo-configuration.json', 'w'), indent=2)
          PY

      - name: Build
        run: |
          set -ex
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export BUILD_NUMBER="$((100 + BUILD_NUMBER_OFFSET))"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          set +e
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --continueOnError \
            --configurationPath="build-system/ayo-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" != "0" ]; then
            # Surface the real errors as annotations (visible without downloading logs)
            grep -E "error:|ERROR:" "$RUNNER_TEMP/build.log" | sort -u | head -15 | cut -c1-900 | while IFS= read -r line; do
              echo "::error title=build error::$line"
            done
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/out"
          # Bazel reports the output as bazel-bin/Telegram/Telegram.ipa
          IPA="bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$IPA" ]; then
            IPA="$(find -L bazel-out/ -path '*/bin/Telegram/Telegram.ipa' -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::error title=IPA not found::Telegram.ipa not found in bazel-bin or bazel-out"
            exit 1
          fi
          # Own bundle id so it installs next to the official Telegram
          python3 "$GITHUB_WORKSPACE/branding/rebundle_ipa.py" "$IPA" "$GITHUB_WORKSPACE/out/AyoGram.ipa" ph.telegra.Telegraph "$APP_BUNDLE_ID"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyoGram-ipa
          path: out/AyoGram.ipa
          retention-days: 14
          compression-level: 0
